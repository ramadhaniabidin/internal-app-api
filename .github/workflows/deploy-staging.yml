name: Build and Deploy API (Staging Environment)

on:
  push:
    branches:
      - staging  # Berjalan otomatis saat PR di-merge atau ada push ke branch staging

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code dari branch staging
      - name: Checkout Staging Code
        uses: actions/checkout@v4

      # 2. Login ke Docker Hub menggunakan PAT
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Setup Docker Buildx untuk support cross-platform AMD64 VPS
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build dan Push Docker Image ke Docker Hub dengan tag staging
      - name: Build and Push Docker Image (Staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .API/Dockerfile
          platforms: linux/amd64
          push: true
          tags: myramadhani/procurement-api:v1-vps-cloud

      # 5. Connect ke VPS K3s via SSH & Rollout Restart
      - name: Deploy to K3s Staging via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 103.169.207.165
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            kubectl rollout restart deployment procurement-api