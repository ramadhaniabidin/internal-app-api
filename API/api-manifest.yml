apiVersion: apps/v1
kind: Deployment
metadata:
  name: procurement-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: procurement-api
  template:
    metadata:
      labels:
        app: procurement-api
    spec:
      containers:
        - name: procurement-api
          image: myramadhani/procurement-api:v1-vps-cloud
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: ConnectionStrings__DockerPostgresConnection
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: ConnectionStrings__DockerPostgresConnection
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: Jwt__Key
            - name: Jwt__Issuer
              value: "ProcurementApi"
            - name: Jwt__Audience
              value: "ProcurementClient"
            - name: AppSettings__APIUsername
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: AppSettings__APIUsername
            - name: AppSettings__APIPassword
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: AppSettings__APIPassword
---
apiVersion: v1
kind: Service
metadata:
  name: procurement-api-service
spec:
  type: NodePort
  selector:
    app: procurement-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080